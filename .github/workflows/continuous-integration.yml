name: Continuous Integration

# Runs on every push to the main line or a release branch, and on every pull
# request that targets one of them, so feature work heading for main and the
# fixes heading for a release train are gated the same way. The steps mirror
# the local commit gate, the code is formatted, linted, and built the same way
# the machine of a contributor does it.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

# A newer push to the same branch supersedes an in flight run, so only the
# latest state is ever spending a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # The pinned tools are compiled from source on first use, which is slow.
      # A cache keyed on their description reuses that work across runs and is
      # rebuilt only when a pinned version changes.
      - name: Cache Tools
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('Mintfile') }}

      # The dependency clones and checkouts of the package manager, keyed on the
      # resolved versions, so cloning and resolving dependencies is done once
      # and reused until a version changes. The partial key lets an older cache
      # seed a run whose versions have moved. Both keys stay empty and harmless
      # until the first dependency is added.
      - name: Cache Packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # The version manager installs the pinned versions and links them onto
      # the path. The setup script is not used here, its job is
      # local convenience and it steps aside when the pipeline variable is set,
      # which the runner provides on its own.
      - name: Install Tools
        run: |
          brew install mint
          mint bootstrap --link

      # On a release branch the version is bumped by hand, so it is checked
      # here. Such a branch names the series it releases, and the version it
      # carries has to belong to that series, otherwise a build would go out
      # reporting a version nobody released. Everywhere else there is nothing
      # to compare against and the step does nothing.
      - name: Version
        run: |
          branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            release/*) ;;
            *) echo "::notice::Not a release branch, nothing to check."; exit 0 ;;
          esac

          series="${branch#release/}"
          version=$(awk -F'=' '/^MARKETING_VERSION/ {gsub(/[ \t]|\/\/.*/, "", $2); print $2}' Configs/Version.xcconfig)

          if [ "${version%.*}" != "$series" ]; then
            echo "::error::Configs/Version.xcconfig says $version, which is not part of the $series series this branch releases. Run Scripts/set-version.sh $series.0 or correct the branch."
            exit 1
          fi
          echo "Version $version matches the $series series."

      # The formatter in report only mode. It rewrites nothing and fails when
      # the tree is not already formatted, so unformatted code cannot merge.
      - name: Format
        run: mint run swiftformat . --lint

      # The linter in strict mode, where a warning is an error, matching the
      # commit gate.
      - name: Lint
        run: mint run swiftlint lint --strict

      # A simulator build against a generic destination, which needs no code
      # signing and no particular simulator to be installed on the runner.
      - name: Build
        run: |
          xcodebuild build \
            -project Meets.xcodeproj \
            -scheme Meets \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      # The whole test suite on one concrete simulator. The modules are expected
      # to use the interface frameworks of the platform, so they are built for a
      # simulator like the application rather than tested on the host.
      #
      # The scheme runs a test plan, and that plan is the list a contributor
      # sees in Xcode, so it is what the pipeline runs as well, which is also
      # what collects coverage. A module whose tests the plan does not name is
      # then run on its own, so tests are never skipped merely because somebody
      # forgot to add them to the plan.
      - name: Test
        run: |
          scheme=Meets.xcodeproj/xcshareddata/xcschemes/Meets.xcscheme

          # The scheme names the plan it runs, so the path is read from there
          # rather than assumed to sit anywhere in particular. A scheme that
          # lists its tests the older way, without a plan, is honored too.
          plan=$(sed -n 's|.*reference *= *"container:\([^"]*\.xctestplan\)".*|\1|p' "$scheme" | head -1)

          app_has_tests=false
          if [ -n "$plan" ] || grep -q TestableReference "$scheme"; then
            app_has_tests=true
          fi

          # The packages the plan already names, so that none of them is run a
          # second time on its own.
          covered=""
          if [ -n "$plan" ] && [ -f "$plan" ]; then
            covered=$(jq -r '.testTargets[].target.containerPath | sub("^container:"; "")' "$plan" | sort -u)
          fi

          # Packages sit at any depth in the module folder, since the layers
          # above them only group, so the search recurses and skips the build
          # folder where dependency checkouts carry their own manifests.
          module_dirs=()
          while IFS= read -r manifest; do
            dir=$(dirname "$manifest")

            if [ ! -d "$dir/Tests" ] || [ -z "$(ls -A "$dir/Tests")" ]; then
              continue
            fi

            if printf '%s\n' "$covered" | grep -qxF "$dir"; then
              continue
            fi

            echo "::warning::$dir carries tests the test plan does not name, running it on its own."
            module_dirs+=("$dir")
          done < <(find Modules -name Package.swift -not -path '*/.build/*' 2>/dev/null | sort)

          if [ "$app_has_tests" = false ] && [ ${#module_dirs[@]} -eq 0 ]; then
            echo "::notice::No app or module tests found yet, skipping the test run."
            exit 0
          fi

          # One simulator serves both the application and the modules, so the
          # interface frameworks resolve, which a host run cannot provide.
          device=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid // empty')
          if [ -z "$device" ]; then
            echo "::error::No iPhone simulator is available on the runner."
            exit 1
          fi

          # A quiet run says nothing about the tests themselves, so the counts
          # are read back from the bundle it leaves behind. A run that tested
          # nothing is refused, because it passes as quietly as a run that
          # tested everything, and the two must not look alike.
          results=$(mktemp -d)

          report() {
            name=$1
            bundle=$2

            summary=$(xcrun xcresulttool get test-results summary --path "$bundle" --format json)
            total=$(echo "$summary" | jq -r '.totalTestCount')
            passed=$(echo "$summary" | jq -r '.passedTests')
            failed=$(echo "$summary" | jq -r '.failedTests')
            skipped=$(echo "$summary" | jq -r '.skippedTests')

            echo "$name, $total tests, $passed passed, $failed failed, $skipped skipped."

            if [ "$total" -eq 0 ]; then
              echo "::error::$name ran no tests at all."
              exit 1
            fi
          }

          if [ "$app_has_tests" = true ]; then
            echo "Testing the application and everything its plan names"

            # The status is kept rather than acted on at once, so the counts are
            # reported even when the run itself failed.
            status=0
            xcodebuild test -project Meets.xcodeproj -scheme Meets -destination "id=$device" \
              -resultBundlePath "$results/application.xcresult" -quiet || status=$?

            report "The application" "$results/application.xcresult"
            [ "$status" -eq 0 ] || exit "$status"
          fi

          for dir in "${module_dirs[@]}"; do
            module=$(basename "$dir")
            echo "Testing module $module"

            status=0
            ( cd "$dir" && xcodebuild test -scheme "$module" -destination "id=$device" \
              -resultBundlePath "$results/$module.xcresult" -quiet ) || status=$?

            report "The module $module" "$results/$module.xcresult"
            [ "$status" -eq 0 ] || exit "$status"
          done

  # The signaling server is a tool for development written in another language,
  # so it neither builds nor ships with the application and has nothing to do
  # with the Apple toolchain. It runs on its own, on a cheaper machine, and
  # beside the gate above rather than after it.
  server:
    name: Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Server

    steps:
      - uses: actions/checkout@v7

      # The version is pinned here the way the language tools are pinned in the
      # mint file, so the machine of a contributor and the runner agree. The
      # cache is keyed on the lock file beside it.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Server/package-lock.json

      # A clean install refuses a lock file that has drifted from the manifest,
      # which is the failure a contributor would otherwise meet on their own
      # machine and nowhere else.
      - name: Install
        run: npm ci

      # The server is started by hand, so nothing here would ever notice a file
      # that does not parse until somebody tried to hold a meeting.
      - name: Check
        run: node --check index.js
